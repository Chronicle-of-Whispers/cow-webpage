name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Configure site URL and base path
        shell: bash
        env:
          CUSTOM_SITE_URL: ${{ vars.SITE_URL }}
          CUSTOM_BASE_PATH: ${{ vars.BASE_PATH }}
        run: |
          repository_name="${GITHUB_REPOSITORY#*/}"

          if [[ -n "$CUSTOM_BASE_PATH" ]]; then
            base_path="$CUSTOM_BASE_PATH"
          elif [[ "$repository_name" == *.github.io ]]; then
            base_path="/"
          else
            base_path="/$repository_name"
          fi

          if [[ -n "$CUSTOM_SITE_URL" ]]; then
            site_url="$CUSTOM_SITE_URL"
          else
            site_url="https://${GITHUB_REPOSITORY_OWNER}.github.io"
          fi

          echo "BASE_PATH=$base_path" >> "$GITHUB_ENV"
          echo "SITE_URL=$site_url" >> "$GITHUB_ENV"

      - name: Install, build, and upload site
        uses: withastro/action@v6
        with:
          node-version: 24

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
